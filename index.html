<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards: Anatomia do Olho Humano</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #1a365d;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .contador {
            font-size: 0.95rem;
            color: #4a5568;
            font-weight: 600;
            background-color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: inline-block;
        }

        /* CONTAINER 3D DO CARTÃO */
        .flashcard-container {
            width: 380px;
            height: 420px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        .flashcard-container.virado .flashcard {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            text-align: center;
        }

        /* FRENTE */
        .frente {
            background: linear-gradient(135deg, #2b6cb0 0%, #1a365d 100%);
            color: #ffffff;
            justify-content: space-between;
            align-items: center;
        }
