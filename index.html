<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck de Flashcards Ilustrados: O Olho Humano</title>
    <style>
        /* RESET E CONFIGURAÇÕES GERAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-deck {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-deck h1 {
            color: #1a365d;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .contador {
            font-size: 1rem;
            color: #4a5568;
            font-weight: 600;
            background-color: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* CONTAINER DO FLASHCARD (PERSPECTIVA 3D) */
        .flashcard-container {
            width: 400px;
            height: 380px; /* Aumentado para acomodar imagem + texto de forma limpa */
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        /* O CARTÃO QUE IRÁ GIRAR */
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
        }

        /* CLASSE DE GIRO ATIVADA PELO CLIQUE */
        .flashcard-container.virado .flashcard {
            transform: rotateY(180deg);
        }

        /* CONFIGURAÇÃO DAS FACES */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }

        /* FACE DA FRENTE (PERGUNTA) */
        .frente {
            background: linear-gradient(135deg, #2b6cb0 0%, #1a365d 100%);
            color: #ffffff;
            border: 2px solid #2b6cb0;
        }

        .frente .categoria {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #90cdf4;
            font-weight: bold;
        }

        .frente h2 {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .frente .instrucao {
            margin-top: 25px;
            font-size: 0.85rem;
            opacity: 0.7;
            font-style: italic;
        }

        /* FACE DO VERSO (RESPOSTA COM IMAGEM) */
        .verso {
            background-color: #ffffff;
            color: #2d3748;
            transform: rotateY(180deg);
            border: 3px solid #2b6cb0;
            justify-content: flex-start; /* Alinha o conteúdo do topo para baixo */
            overflow-y: auto; /* Permite rolagem se a tela for muito pequena */
        }

        .verso .titulo-resposta {
            font-size: 1.3rem;
            color: #2b6cb0;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* CONTEXTO DA IMAGEM ESTRUTURADA */
        .card-imagem {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background-color: #f7fafc;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .verso p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #4a5568;
        }

        /* CONTROLES DE NAVEGAÇÃO */
        .controles {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(43, 108, 176, 0.15);
        }

        .btn:hover {
            background-color: #1a365d;
        }

        .btn:disabled {
            background-color: #cbd5e0;
            color: #718096;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ADAPTAÇÃO PARA CELULAR */
        @media (max-width: 420px) {
            .flashcard-container {
                width: 100%;
                max-width: 340px;
                height: 420px;
            }
            .card-imagem {
                height: 110px;
            }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DO DECK -->
    <div class="header-deck">
        <h1>Estudos: Olho Humano</h1>
        <div class="contador" id="contador-progresso">Cartão 1 de 5</div>
    </div>

    <div class="flashcard-container" id="card-container" onclick="virarCard()">

            <div class="face verso">

            </div>

        </div>

    </div>
