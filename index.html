<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck de Flashcards Ilustrados: O Olho Humano</title>
    <style>
        /* RESET E CONFIGURAÇÕES GERAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-deck {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-deck h1 {
            color: #1a365d;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .contador {
            font-size: 1rem;
            color: #4a5568;
            font-weight: 600;
            background-color: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* CONTAINER DO FLASHCARD (PERSPECTIVA 3D) */
        .flashcard-container {
            width: 400px;
            height: 400px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        /* O CARTÃO QUE IRÁ GIRAR */
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
        }

        /* CLASSE DE GIRO ATIVADA PELO CLIQUE */
        .flashcard-container.virado .flashcard {
            transform: rotateY(180deg);
        }

        /* CONFIGURAÇÃO DAS FACES */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1
